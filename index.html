<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>eehl · 일</title>
    <meta name="description" content="Count-ups and countdowns with D-day, 100-day milestones and lunar dates. Offline, private, no Google." />
    <meta name="theme-color" content="#f7f5f2" />
    <meta name="color-scheme" content="light dark" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icons/mark.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="eehl" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <script>
      // Paint the right theme before the app loads (avoids a white flash).
      try {
        var s = JSON.parse(localStorage.getItem('eehl:data:v1') || '{}').settings || {};
        var m = s.theme || 'system';
        var dark = matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.dataset.theme = m === 'system' ? (dark ? 'dark' : 'light') : m;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <noscript>eehl needs JavaScript to count.</noscript>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
